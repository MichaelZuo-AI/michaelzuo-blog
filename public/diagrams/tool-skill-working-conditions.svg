<svg xmlns="http://www.w3.org/2000/svg" width="600" height="386" viewBox="0 0 600 386"><title>排查启动失败时，谁决定什么？</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#236e5d"/></marker></defs><rect width="600" height="386" fill="#faf9f4"/><g font-family="PingFang SC, sans-serif"><text x="24" y="47" font-size="28" text-anchor="start" font-weight="600" fill="#183c35">排查启动失败时，谁决定什么？</text><rect x="22" y="76" width="556" height="75" rx="10" fill="#f4e9dd"/><text x="40" y="108" font-size="23" text-anchor="start" font-weight="600" fill="#183c35">团队先约定</text><text x="40" y="136" font-size="20" text-anchor="start" font-weight="400" fill="#183c35">目标：找到失败原因　　边界：只读排查</text><rect x="22" y="172" width="268" height="80" rx="10" fill="#e4f1e9"/><text x="38" y="203" font-size="22" text-anchor="start" font-weight="600" fill="#183c35">可用的上下文</text><text x="38" y="235" font-size="20" text-anchor="start" font-weight="400" fill="#183c35">启动日志、版本记录</text><rect x="310" y="172" width="268" height="80" rx="10" fill="#e4f1e9"/><text x="326" y="203" font-size="22" text-anchor="start" font-weight="600" fill="#183c35">可调用的工具</text><text x="326" y="235" font-size="20" text-anchor="start" font-weight="400" fill="#183c35">查询可用磁盘空间</text><path d="M156 255 V275 H298 V297" fill="none" stroke="#236e5d" stroke-width="2" marker-end="url(#a)"/><path d="M444 255 V275 H302 V297" fill="none" stroke="#236e5d" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="304" width="556" height="60" rx="10" fill="#e4f1e9"/><text x="300" y="342" font-size="22" text-anchor="middle" font-weight="600" fill="#183c35">模型读到“磁盘已满”，选择查剩余空间</text></g></svg>
