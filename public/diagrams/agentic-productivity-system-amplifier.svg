<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Coding amplifies the engineering system</title>
  <desc id="desc">A side-by-side terminal-style diagram comparing mature and fragile engineering systems under Agentic Coding leverage.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#72D572" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="20" y="20" width="1080" height="520" rx="8" fill="#12160F" stroke="#3A442F" stroke-width="1.5"/>
  <rect x="20" y="20" width="1080" height="520" rx="8" fill="url(#grid)"/>
  <circle cx="44" cy="42" r="6" fill="#D96B5F"/>
  <circle cx="64" cy="42" r="6" fill="#F2C15B"/>
  <circle cx="84" cy="42" r="6" fill="#72D572"/>
  <text x="52" y="94" fill="#E8F6D8" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Agentic Coding 是 Amplifier，不是 Silver Bullet</text>
  <text x="52" y="124" fill="#9CA989" font-size="14" font-family="system-ui, -apple-system, sans-serif">它会放大已有工程系统的能力，也会放大已有工程系统的混乱。</text>

  <rect x="70" y="170" width="460" height="286" rx="8" fill="#20251A" stroke="#3A442F" stroke-width="1.5"/>
  <text x="300" y="210" text-anchor="middle" fill="#72D572" font-size="20" font-weight="800" font-family="system-ui, -apple-system, sans-serif">Mature System</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14">
    <rect x="112" y="246" width="170" height="44" rx="6" fill="#2A3022" stroke="#72D572" stroke-width="1.5"/>
    <text x="197" y="274" text-anchor="middle" fill="#E8F6D8">clear requirement</text>
    <rect x="318" y="246" width="170" height="44" rx="6" fill="#2A3022" stroke="#72D572" stroke-width="1.5"/>
    <text x="403" y="274" text-anchor="middle" fill="#E8F6D8">stable CI / tests</text>
    <rect x="112" y="310" width="170" height="44" rx="6" fill="#2A3022" stroke="#72D572" stroke-width="1.5"/>
    <text x="197" y="338" text-anchor="middle" fill="#E8F6D8">test data</text>
    <rect x="318" y="310" width="170" height="44" rx="6" fill="#2A3022" stroke="#72D572" stroke-width="1.5"/>
    <text x="403" y="338" text-anchor="middle" fill="#E8F6D8">quality gates</text>
  </g>
  <rect x="134" y="390" width="332" height="42" rx="6" fill="#2A3022" stroke="#72D572" stroke-width="1.5"/>
  <text x="300" y="417" text-anchor="middle" fill="#72D572" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif">AI leverage → throughput gain</text>

  <rect x="590" y="170" width="460" height="286" rx="8" fill="#20251A" stroke="#3A442F" stroke-width="1.5"/>
  <text x="820" y="210" text-anchor="middle" fill="#D96B5F" font-size="20" font-weight="800" font-family="system-ui, -apple-system, sans-serif">Fragile System</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14">
    <rect x="632" y="246" width="170" height="44" rx="6" fill="#2B1D19" stroke="#D96B5F" stroke-width="1.5"/>
    <text x="717" y="274" text-anchor="middle" fill="#E8F6D8">unclear requirement</text>
    <rect x="838" y="246" width="170" height="44" rx="6" fill="#2B1D19" stroke="#D96B5F" stroke-width="1.5"/>
    <text x="923" y="274" text-anchor="middle" fill="#E8F6D8">flaky tests</text>
    <rect x="632" y="310" width="170" height="44" rx="6" fill="#2B1D19" stroke="#D96B5F" stroke-width="1.5"/>
    <text x="717" y="338" text-anchor="middle" fill="#E8F6D8">manual QA glue</text>
    <rect x="838" y="310" width="170" height="44" rx="6" fill="#2B1D19" stroke="#D96B5F" stroke-width="1.5"/>
    <text x="923" y="338" text-anchor="middle" fill="#E8F6D8">hidden contracts</text>
  </g>
  <rect x="654" y="390" width="332" height="42" rx="6" fill="#2B1D19" stroke="#D96B5F" stroke-width="1.5"/>
  <text x="820" y="417" text-anchor="middle" fill="#D96B5F" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif">AI leverage → amplified chaos</text>

  <text x="560" y="500" text-anchor="middle" fill="#9CA989" font-size="14" font-style="italic" font-family="system-ui, -apple-system, sans-serif">先补地基，再扩大 AI 的职责边界。</text>
</svg>
