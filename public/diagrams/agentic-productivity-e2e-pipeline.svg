<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Productivity is an E2E pipeline problem</title>
  <desc id="desc">A terminal-style diagram showing that coding is one stage in a broader software delivery lifecycle.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#72D572" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#72D572" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1080" height="520" rx="8" fill="#12160F" stroke="#3A442F" stroke-width="1.5"/>
  <rect x="20" y="20" width="1080" height="520" rx="8" fill="url(#grid)"/>
  <circle cx="44" cy="42" r="6" fill="#D96B5F"/>
  <circle cx="64" cy="42" r="6" fill="#F2C15B"/>
  <circle cx="84" cy="42" r="6" fill="#72D572"/>
  <text x="52" y="94" fill="#E8F6D8" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Engineering Productivity 是 E2E Throughput</text>
  <text x="52" y="124" fill="#9CA989" font-size="14" font-family="system-ui, -apple-system, sans-serif">Coding 只是其中一环。局部提速不等于整体交付变快。</text>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">
    <rect x="60" y="190" width="132" height="82" rx="6" fill="#20251A" stroke="#3A442F" stroke-width="1.5"/>
    <text x="126" y="223" text-anchor="middle" fill="#E8F6D8">Requirement</text>
    <text x="126" y="249" text-anchor="middle" fill="#9CA989" font-size="12" font-weight="500">intent / scope</text>

    <rect x="226" y="190" width="132" height="82" rx="6" fill="#20251A" stroke="#3A442F" stroke-width="1.5"/>
    <text x="292" y="223" text-anchor="middle" fill="#E8F6D8">Design</text>
    <text x="292" y="249" text-anchor="middle" fill="#9CA989" font-size="12" font-weight="500">UX / system</text>

    <rect x="392" y="174" width="150" height="114" rx="6" fill="#2A3022" stroke="#72D572" stroke-width="2"/>
    <text x="467" y="217" text-anchor="middle" fill="#E8F6D8">Coding</text>
    <text x="467" y="243" text-anchor="middle" fill="#72D572" font-size="12" font-weight="600">AI 最容易加速</text>

    <rect x="576" y="190" width="132" height="82" rx="6" fill="#20251A" stroke="#3A442F" stroke-width="1.5"/>
    <text x="642" y="223" text-anchor="middle" fill="#E8F6D8">Testing</text>
    <text x="642" y="249" text-anchor="middle" fill="#9CA989" font-size="12" font-weight="500">verification</text>

    <rect x="742" y="190" width="132" height="82" rx="6" fill="#20251A" stroke="#3A442F" stroke-width="1.5"/>
    <text x="808" y="223" text-anchor="middle" fill="#E8F6D8">Review</text>
    <text x="808" y="249" text-anchor="middle" fill="#9CA989" font-size="12" font-weight="500">risk / intent</text>

    <rect x="908" y="190" width="132" height="82" rx="6" fill="#20251A" stroke="#3A442F" stroke-width="1.5"/>
    <text x="974" y="223" text-anchor="middle" fill="#E8F6D8">Release</text>
    <text x="974" y="249" text-anchor="middle" fill="#9CA989" font-size="12" font-weight="500">validation</text>
  </g>

  <g fill="none" stroke="#72D572" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)">
    <path d="M192 231 H226"/>
    <path d="M358 231 H392"/>
    <path d="M542 231 H576"/>
    <path d="M708 231 H742"/>
    <path d="M874 231 H908"/>
  </g>

  <rect x="152" y="360" width="816" height="92" rx="8" fill="rgba(32,37,26,0.72)" stroke="#4F5A40" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="560" y="394" text-anchor="middle" fill="#E8F6D8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">真正要优化的是端到端交付吞吐</text>
  <text x="560" y="424" text-anchor="middle" fill="#9CA989" font-family="system-ui, -apple-system, sans-serif" font-size="14">如果 bottleneck 在下游，coding acceleration 会被 testing / review / release 吃掉。</text>
</svg>
