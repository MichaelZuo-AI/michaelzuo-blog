<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="600" height="548" viewBox="0 0 600 548">
  <title id="title">下一个任务，能借用什么？</title>
  <desc id="desc">上次任务留下工具、脚本和排查笔记。下次先判断是否适用，再决定直接使用、修改验证或跳过，验证过的改动继续留给下次。</desc>
  <defs>
    <marker id="a21654F" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto">
      <path d="M1,1 L6.2,3.5 L1,6" fill="none" stroke="#21654F" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"/>
    </marker>
    <marker id="a98542D" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto">
      <path d="M1,1 L6.2,3.5 L1,6" fill="none" stroke="#98542D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"/>
    </marker>
    <marker id="a51655C" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto">
      <path d="M1,1 L6.2,3.5 L1,6" fill="none" stroke="#51655C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="548" rx="0" fill="#F8F6EE" stroke="none" stroke-width="1.5"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="28" y="53" font-size="35" fill="#203C35" font-weight="650" text-anchor="start">下一个任务，能借用什么？</text>
    <path d="M31 130 V100 Q31 95 37 95 H72 L84 106 H119 V130" fill="#DEEBDE" stroke="#21654F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="31" y="116" width="90" height="54" rx="6" fill="#DEEBDE" stroke="#21654F" stroke-width="2.1"/>
    <text x="144" y="122" font-size="25" fill="#203C35" font-weight="650" text-anchor="start">上次任务留下的东西</text>
    <text x="144" y="158" font-size="24" fill="#51655C" font-weight="500" text-anchor="start">工具、脚本、排查笔记</text>
    <path d="M74 172 V211" fill="none" stroke="#21654F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a21654F)"/>
    <circle cx="74" cy="248" r="24" fill="#21654F"/>
    <path d="M64 247 l7 7 13 -14" fill="none" stroke="#FFFDF7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="257" font-size="28" fill="#21654F" font-weight="650" text-anchor="start">新任务先核对适用条件</text>
    <path d="M74 274 V413" fill="none" stroke="#A8B3A4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 302 H112" fill="none" stroke="#21654F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a21654F)"/>
    <text x="132" y="310" font-size="23" fill="#51655C" font-weight="500" text-anchor="start">条件相同</text>
    <text x="315" y="310" font-size="26" fill="#203C35" font-weight="650" text-anchor="start">直接复用</text>
    <path d="M74 358 H112" fill="none" stroke="#21654F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a21654F)"/>
    <text x="132" y="366" font-size="23" fill="#51655C" font-weight="500" text-anchor="start">环境有差异</text>
    <text x="315" y="366" font-size="26" fill="#203C35" font-weight="650" text-anchor="start">改后验证</text>
    <path d="M74 414 H112" fill="none" stroke="#21654F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a21654F)"/>
    <text x="132" y="422" font-size="23" fill="#51655C" font-weight="500" text-anchor="start">条件不满足</text>
    <text x="315" y="422" font-size="26" fill="#203C35" font-weight="650" text-anchor="start">这次跳过</text>
    <path d="M132 329 H541" fill="none" stroke="#CCD2C3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M132 385 H541" fill="none" stroke="#CCD2C3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="459" width="541" height="64" rx="9" fill="#DEEBDE" stroke="none" stroke-width="1.5"/>
    <text x="50" y="500" font-size="25" fill="#21654F" font-weight="600" text-anchor="start">把这次验证过的改动留给下次。</text>
    <path d="M530 458 H561 Q580 458 580 440 V147 Q580 134 567 134 H431" fill="none" stroke="#21654F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a21654F)" stroke-dasharray="5 7"/>
  </g>
</svg>
