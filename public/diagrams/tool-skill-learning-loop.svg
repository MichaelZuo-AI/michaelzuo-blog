<svg xmlns="http://www.w3.org/2000/svg" width="600" height="397" viewBox="0 0 600 397"><title>上次的解法，这次还适用吗？</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#236e5d"/></marker></defs><rect width="600" height="397" fill="#faf9f4"/><g font-family="PingFang SC, sans-serif"><text x="24" y="47" font-size="28" text-anchor="start" font-weight="600" fill="#183c35">上次的解法，这次还适用吗？</text><rect x="27" y="76" width="546" height="60" rx="10" fill="#e4f1e9"/><text x="300" y="114" font-size="23" text-anchor="middle" font-weight="600" fill="#183c35">上次执行留下脚本、依据和适用条件</text><path d="M300 140 V163" fill="none" stroke="#236e5d" stroke-width="2" marker-end="url(#a)"/><rect x="80" y="170" width="440" height="62" rx="10" fill="#e4f1e9"/><text x="300" y="210" font-size="23" text-anchor="middle" font-weight="600" fill="#183c35">复核后，供下一项任务查阅</text><path d="M300 237 V262 H109 V285" fill="none" stroke="#236e5d" stroke-width="2" marker-end="url(#a)"/><path d="M300 237 V285" fill="none" stroke="#236e5d" stroke-width="2" marker-end="url(#a)"/><path d="M300 262 H491 V285" fill="none" stroke="#236e5d" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="292" width="170" height="56" rx="10" fill="#f4e9dd"/><text x="109" y="328" font-size="21" text-anchor="middle" font-weight="600" fill="#183c35">直接复用</text><rect x="215" y="292" width="170" height="56" rx="10" fill="#f4e9dd"/><text x="300" y="328" font-size="21" text-anchor="middle" font-weight="600" fill="#183c35">调整后试用</text><rect x="406" y="292" width="170" height="56" rx="10" fill="#f4e9dd"/><text x="491" y="328" font-size="21" text-anchor="middle" font-weight="600" fill="#183c35">另找方法</text><text x="300" y="379" font-size="20" text-anchor="middle" font-weight="400" fill="#536a62">依据新任务的现场证据，重新判断。</text></g></svg>
