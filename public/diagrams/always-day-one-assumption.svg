<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="title desc">
  <title id="title">给旧判断补上半句话</title>
  <desc id="desc">一张旧纸条写着每一步都得先安排好。铅笔在句首添上当时的前提。下方一张新纸条把它改写成今天可以动手试的问题。</desc>
  <rect width="600" height="480" fill="#f4f0e6"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="33" y="51" font-size="33" font-weight="600" fill="#233f37">给旧判断补上半句话</text>
    <!-- On the old slip, the pencil insertion returns the claim to its context. -->
    <g transform="rotate(-2 302 190)">
      <path d="M52 101 L544 93 L552 249 L59 257 Z" fill="#dfdacb"/>
      <path d="M48 95 L539 88 L546 244 L55 253 Z" fill="#fffaf0" stroke="#ccbfab" stroke-width="1.5"/>
      <path d="M76 218 L518 211" fill="none" stroke="#d9cfc0" stroke-width="1.2"/>
      <path d="M67 110 L66 134 Q66 144 73 144 Q80 144 81 135 L83 102 Q84 94 79 94 Q74 94 74 102 L72 132" fill="none" stroke="#a19986" stroke-width="2.7" stroke-linecap="round"/>
      <text x="119" y="144" font-size="30" fill="#29644f" font-family="Kaiti SC, PingFang SC, sans-serif">按我当时的经验，</text>
      <path d="M122 151 Q103 154 99 173 M92 187 L100 173 L108 186" fill="none" stroke="#39765a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="113" y="205" font-size="36" fill="#3e413b" font-weight="500">每一步都得先安排好。</text>
    </g>
    <!-- A second slip carries the question,. -->
    <path d="M129 261 Q114 291 86 302 M91 290 L84 303 L99 300" fill="none" stroke="#8b816d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(1 300 370)">
      <path d="M69 318 L548 310 L544 453 L65 458 Z" fill="#d2dacb"/>
      <path d="M64 314 L544 306 L539 448 L61 452 Z" fill="#e5eddf" stroke="#b6c8b3" stroke-width="1.5"/>
      <path d="M78 322 L77 437" fill="none" stroke="#b2c8b3" stroke-width="1.4"/>
      <text x="99" y="365" font-size="30" font-weight="500" fill="#254a3b">今天，让模型自己选下一步，</text>
      <text x="99" y="415" font-size="36" font-weight="600" fill="#254a3b">会发生什么？</text>
      <path d="M101 426 Q183 431 288 422" fill="none" stroke="#c18e46" stroke-width="3.1" stroke-linecap="round"/>
    </g>
  </g>
</svg>
