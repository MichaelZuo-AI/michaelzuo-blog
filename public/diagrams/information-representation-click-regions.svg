<text x="56" y="123" font-size="40" fill="#193C36" font-weight="600" text-anchor="start">“点击商品卡片”，到底点哪里？</text>
<text x="56" y="171" font-size="26" fill="#60756F" font-weight="400" text-anchor="start">假设设计示例 · 区域边界与行为标注需要一起表达</text>
