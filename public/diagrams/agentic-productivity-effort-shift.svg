<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Effort shift in Agentic Coding</title>
  <desc id="desc">A terminal-style diagram showing coding effort going down while verification-related effort goes up.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#72D572" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#F2C15B" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1080" height="520" rx="8" fill="#12160F" stroke="#3A442F" stroke-width="1.5"/>
  <rect x="20" y="20" width="1080" height="520" rx="8" fill="url(#grid)"/>
  <circle cx="44" cy="42" r="6" fill="#D96B5F"/>
  <circle cx="64" cy="42" r="6" fill="#F2C15B"/>
  <circle cx="84" cy="42" r="6" fill="#72D572"/>
  <text x="52" y="94" fill="#E8F6D8" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Effort Shift：工作量可能只是换了地方</text>
  <text x="52" y="124" fill="#9CA989" font-size="14" font-family="system-ui, -apple-system, sans-serif">AI 降低 coding effort，但可能把成本转移到 verification phase。</text>

  <rect x="78" y="174" width="360" height="246" rx="8" fill="#20251A" stroke="#3A442F" stroke-width="1.5"/>
  <text x="258" y="214" text-anchor="middle" fill="#E8F6D8" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Before Agentic Coding</text>
  <rect x="122" y="250" width="76" height="110" rx="5" fill="#2A3022" stroke="#72D572" stroke-width="1.5"/>
  <rect x="220" y="280" width="76" height="80" rx="5" fill="#2A3022" stroke="#72D572" stroke-width="1.5"/>
  <rect x="318" y="300" width="76" height="60" rx="5" fill="#2A3022" stroke="#72D572" stroke-width="1.5"/>
  <text x="160" y="385" text-anchor="middle" fill="#9CA989" font-size="12" font-family="system-ui, -apple-system, sans-serif">Coding</text>
  <text x="258" y="385" text-anchor="middle" fill="#9CA989" font-size="12" font-family="system-ui, -apple-system, sans-serif">QA</text>
  <text x="356" y="385" text-anchor="middle" fill="#9CA989" font-size="12" font-family="system-ui, -apple-system, sans-serif">Review</text>

  <path d="M464 298 C510 260 548 260 594 298" fill="none" stroke="#F2C15B" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowAmber)"/>
  <text x="529" y="245" text-anchor="middle" fill="#F2C15B" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">effort moves</text>

  <rect x="656" y="174" width="390" height="246" rx="8" fill="#20251A" stroke="#3A442F" stroke-width="1.5"/>
  <text x="851" y="214" text-anchor="middle" fill="#E8F6D8" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif">After Agentic Coding</text>
  <rect x="696" y="315" width="64" height="45" rx="5" fill="#2A3022" stroke="#72D572" stroke-width="1.5"/>
  <rect x="782" y="244" width="64" height="116" rx="5" fill="#2A2418" stroke="#F2C15B" stroke-width="1.5"/>
  <rect x="868" y="230" width="64" height="130" rx="5" fill="#2A2418" stroke="#F2C15B" stroke-width="1.5"/>
  <rect x="954" y="258" width="64" height="102" rx="5" fill="#2B1D19" stroke="#D96B5F" stroke-width="1.5"/>
  <text x="728" y="385" text-anchor="middle" fill="#9CA989" font-size="12" font-family="system-ui, -apple-system, sans-serif">Coding</text>
  <text x="814" y="385" text-anchor="middle" fill="#9CA989" font-size="12" font-family="system-ui, -apple-system, sans-serif">QA</text>
  <text x="900" y="385" text-anchor="middle" fill="#9CA989" font-size="12" font-family="system-ui, -apple-system, sans-serif">Debug</text>
  <text x="986" y="385" text-anchor="middle" fill="#9CA989" font-size="12" font-family="system-ui, -apple-system, sans-serif">Release</text>

  <rect x="170" y="456" width="780" height="48" rx="6" fill="#2A2418" stroke="#F2C15B" stroke-width="1.5"/>
  <text x="560" y="486" text-anchor="middle" fill="#F2C15B" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif">只看 developer coding time，会高估真实 productivity gain。</text>
</svg>
